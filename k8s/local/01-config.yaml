apiVersion: v1
kind: ConfigMap
metadata:
  name: orderflow-config
  namespace: orderflow
  labels:
    app.kubernetes.io/part-of: orderflow
data:
  # Shared
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # Database connection (credentials are in the Secret)
  DB_HOST: "postgres"              # the Postgres Service name (step 3)
  DB_PORT: "5432"
  DB_NAME: "orderflow"
  DB_SSL: "false"                  # "true" on EKS with RDS

  # RabbitMQ host (credentials are in the Secret)
  RABBITMQ_HOST: "rabbitmq"        # the RabbitMQ Service name (step 3)

  # Order API
  PORT: "3000"
  JWT_EXPIRES_IN_SECONDS: "3600"
  CURRENCY: "USD"

  # Order Worker
  WORKER_PORT: "3001"
  WORKER_PREFETCH: "10"
  WORKER_MAX_ATTEMPTS: "3"
  WORKER_SHUTDOWN_TIMEOUT_MS: "20000"
  PAYMENT_DECLINE_RATE: "0.1"
  PAYMENT_ERROR_RATE: "0.1"
  PAYMENT_MIN_LATENCY_MS: "200"
  PAYMENT_MAX_LATENCY_MS: "1000"
